apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  labels:
    app: payments-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-worker
  template:
    metadata:
      labels:
        app: payments-worker
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: payments-worker
          image: fiapcg.azurecr.io/payment-worker:v1
          imagePullPolicy: Always
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"          

            - name: PAYMENTS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PAYMENTS_TOPIC

            - name: ORDERS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ORDERS_TOPIC

            - name: PAYMENT_SUBSCRIPTION
              valueFrom:
                configMapKeyRef:
                  name: payments-worker-config
                  key: PAYMENT_SUBSCRIPTION

            - name: KeyVaultUri
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KeyVaultUri

            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AZURE_TENANT_ID

            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AZURE_CLIENT_ID

            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AZURE_CLIENT_SECRET
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"