apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  labels:
    app: payments-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-worker
  template:
    metadata:
      labels:
        app: payments-worker
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: payments-worker
          image: fiapcloudgames.azurecr.io/payment-worker:v1
          imagePullPolicy: Always
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: PAYMENTS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PAYMENTS_TOPIC
            - name: ORDERS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ORDERS_TOPIC
            - name: PAYMENT_SUBSCRIPTION
              valueFrom:
                configMapKeyRef:
                  name: payments-worker-config
                  key: PAYMENT_SUBSCRIPTION
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"