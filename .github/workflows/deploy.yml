name: CI/CD Pipeline - Payments Worker

on:
  push:
    branches:
      - cloud
  pull_request:
    branches:
      - cloud
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Unit Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  deploy:
    name: Build Docker Images & Deploy to AKS
    needs: build-and-test
    if: github.ref == 'refs/heads/cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # 1. Autenticação na Azure
      - name: Azure Login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Login no ACR
      - name: Login to Azure Container Registry (ACR)
        run: |
          az acr login --name fiapcg

      # 3. Build & Push da Imagem do PaymentWorker
      - name: Build and Push PaymentsWorker Docker Image
        run: |
          REGISTRY_URL=fiapcg.azurecr.io
          # ATENÇÃO: Confirme se a pasta é PaymentsWorker/Dockerfile ou Payments.Worker/Dockerfile
          docker build -f PaymentsWorker/Dockerfile -t $REGISTRY_URL/payment-worker:${{ github.sha }} -t $REGISTRY_URL/payment-worker:latest .
          docker push $REGISTRY_URL/payment-worker:${{ github.sha }}
          docker push $REGISTRY_URL/payment-worker:latest

      # 4. Configurar contexto do AKS
      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      # 5. Deploy do Worker no Kubernetes (Cria ou Atualiza automaticamente)
      - name: Deploy PaymentsWorker to K8s
        run: |
          REGISTRY_URL=fiapcg.azurecr.io     
          kubectl apply -f k8s/
          kubectl rollout status deployment/payments-worker --timeout=120s
